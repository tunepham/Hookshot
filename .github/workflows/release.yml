# Releases with release-please (docs/versioning.md). Every release is first a release candidate:
# - On every push to main, release-please keeps one release pull request open: the next release candidate (2.1.0-rc.1,
#   then 2.1.0-rc.2 of the same version), from the Conventional Commit titles of the pull requests merged since the last
#   one, and its CHANGELOG.md entry.
# - Merging that pull request tags the merge commit and makes the release candidate as a draft. This workflow then
#   builds its files with the Linux AppImage and Windows builder workflows, which attach them, and publishes it as a
#   prerelease once all of them are there.
# - Promote (this workflow started by hand, with the release candidate to promote): its version is tagged on the same
#   commit and built and published the same way, as the latest release, with the notes of its release candidates. Then
#   .release-please-manifest.json gets the version, so the next release pull request proposes the next version's first
#   release candidate. A Promote run is one at a time, from promote to record (the concurrency below), and a Promote of
#   a version already published is refused.
# - Record: whenever a version's release (v2.1.0, not a prerelease) is published, however it was published, the manifest
#   and CHANGELOG.md get it (the record job). In a Promote run it runs after publish, or after a failure once the release
#   is published anyway; a release published by hand starts this workflow (release: published) for it. A release
#   published with GITHUB_TOKEN starts no workflow, so the Promote run's own record job is the one for those.
# - rc: after either publish, and for a release published by hand, the rc prerelease gets the newest release candidate's
#   or release's AppImage and .zsync (the rc job), for the update information of release candidates' AppImages.
# No game data is involved.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rc:
        description: >-
          Promote: the release candidate to publish as its version (v2.1.0-rc.2 is published as v2.1.0). Empty: the
          newest release candidate.
        type: string
        required: false
  # (a version published by hand, or by anything but this workflow's token: the record job records it)
  release:
    types: [published]

permissions:
  contents: read

# A Promote run holds this from its promote job to its record job, its builds and uploads included, so two Promote runs
# never work on one draft at once (v2.1.0's did: one run's upload published the release while the other's was
# uploading). A second Promote started meanwhile waits, then is refused once the version is published; a third one
# replaces the second while it waits. Other runs (a push, a release published) each have their own group.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'release-promote' || format('release-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # (one at a time, in order; only this job, so the builds of a release never hold up the next push. A push that waits
    # behind another one's is replaced by the newer one, which reads the same commits and makes any release they make)
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    # (the release pull request and its branch; the tag and the draft release)
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # (started by hand on main: the release candidate checked, the version's tag on its commit and its draft release with
  # the release candidates' notes, scripts/release_promote.sh)
  # (one at a time: the workflow's concurrency group, which covers the whole run)
  promote:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # (the tag and the draft release; actions: read, the other Promote runs in progress)
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.promote.outputs.tag }}
      rc: ${{ steps.promote.outputs.rc }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RC: ${{ inputs.rc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: promote
        run: scripts/release_promote.sh prepare "$RC"

  # (called here, not started by the tag: a tag made with GITHUB_TOKEN starts no workflow. A release candidate's files and
  # its version's are built the same way, from the same commit when it is promoted)
  linux:
    needs: [release-please, promote]
    if: ${{ !cancelled() && (needs.release-please.outputs.created == 'true' || needs.promote.outputs.tag != '') }}
    uses: ./.github/workflows/linux-appimage.yml
    with:
      tag: ${{ needs.release-please.outputs.tag || needs.promote.outputs.tag }}
    # (id-token and attestations: the build provenance of the files)
    permissions:
      contents: write
      id-token: write
      attestations: write

  windows:
    needs: [release-please, promote]
    if: ${{ !cancelled() && (needs.release-please.outputs.created == 'true' || needs.promote.outputs.tag != '') }}
    uses: ./.github/workflows/windows-builder.yml
    with:
      tag: ${{ needs.release-please.outputs.tag || needs.promote.outputs.tag }}
    # (id-token and attestations: the build provenance of the files)
    permissions:
      contents: write
      id-token: write
      attestations: write

  # The draft becomes the release players see, with every file attached: the setup and the builder's update check read
  # the latest release's hookshot-setup.txt. Before that, the release gets SHA256SUMS (the SHA-256 of every file, signed
  # like the files) and the "Which file do I download?" table under its notes (scripts/release_files.sh). A release
  # candidate (2.1.0-rc.1) is a prerelease, never "latest"; a promoted version is the latest release. To attach the files
  # again, re-run the failed jobs of this run: the files are replaced.
  publish:
    needs: [release-please, promote, linux, windows]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # (id-token and attestations: SHA256SUMS's build provenance)
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag || needs.promote.outputs.tag }}
      WINDOWS_BY_HAND: ${{ vars.CI_RELEASE_WINDOWS == 'false' }}
    steps:
      - if: env.WINDOWS_BY_HAND == 'true'
        run: >-
          echo "::notice::$TAG stays a draft: upload HookshotBuilder.exe and hookshot-setup.txt, run
          scripts/release_files.sh finish $TAG, then publish it: that starts this workflow's record job for it."
      - if: env.WINDOWS_BY_HAND != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: SHA256SUMS and the table of the files
        if: env.WINDOWS_BY_HAND != 'true'
        run: scripts/release_files.sh finish "$TAG" SHA256SUMS
      - name: Every file is there
        if: env.WINDOWS_BY_HAND != 'true'
        run: >-
          scripts/release_files.sh check "$TAG" hookshot-linux.txt hookshot-setup.txt HookshotBuilder.exe
          "Hookshot-$TAG-x86_64.AppImage" "Hookshot-$TAG-x86_64.AppImage.zsync"
      - if: env.WINDOWS_BY_HAND != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: SHA256SUMS
      # (by the release's id: a draft is not found by its tag)
      - name: Publish the release
        if: env.WINDOWS_BY_HAND != 'true'
        run: scripts/release_files.sh publish "$TAG"

  # rc, the latest release candidate (scripts/release_rc.sh): a rolling prerelease, never "latest", holding the Linux
  # AppImage and .zsync of the newest published release candidate or release, which a release candidate's AppImage names
  # in its update information so that AppImageUpdate moves it on. After publish (a release candidate's files, or a
  # promoted version's), and when a release is published by hand (release: published). It makes rc hold the newest
  # release there is, not this run's, so a run of this job replaced while it waits loses nothing.
  rc:
    needs: [publish]
    if: >-
      !cancelled() && (needs.publish.result == 'success'
      || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !github.event.release.draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # (one at a time, across runs: a release candidate's run and a Promote run never change rc at once)
    concurrency:
      group: release-rc
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: The latest release candidate
        run: scripts/release_rc.sh

  # Once a version's release is published: .release-please-manifest.json gets the version (scripts/release_promote.sh
  # record), so the next release pull request proposes the next version's first release candidate, and CHANGELOG.md the
  # version's entry. In a Promote run, after publish, or after a failure when the release was published anyway; on
  # release: published, for a version's release published by hand. It records only a published v<major>.<minor>.<patch>
  # release, and once: run again, it finds the manifest and the changelog have it and changes nothing.
  # Pushed to main; where main takes no direct push (branch protection), a small pull request instead, to merge before
  # the release pull request. Then the release pull request is made again from the new manifest.
  record:
    needs: [promote, publish]
    if: >-
      !cancelled() && ((github.event_name == 'workflow_dispatch' && needs.promote.result == 'success')
      || (github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # (one at a time: a Promote run's and a release: published run's for the same version, the second changing nothing)
    concurrency:
      group: release-record
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.promote.outputs.tag || github.event.release.tag_name }}
      RC: ${{ needs.promote.outputs.rc }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          # (the push below)
          persist-credentials: true
      - name: Manifest and changelog
        id: record
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "$TAG is not a version's tag: nothing to record"; exit 0; fi
          # (published: GitHub's get-a-release-by-tag finds only a published release)
          if ! gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '"\(.tag_name) published \(.published_at)"'; then
            echo "::notice::$TAG is not published: nothing to record"
            exit 0
          fi
          scripts/release_promote.sh record "$TAG" "$RC"
          if git diff --quiet; then echo "$TAG is recorded already: nothing to change"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          title="chore(release): record ${TAG#v} as released"
          git commit -qam "$title" -m "$TAG is published. The next release pull request proposes the next version's release candidate."
          if git push origin "HEAD:refs/heads/$BRANCH"; then
            echo "pushed=true" >>"$GITHUB_OUTPUT"
          else
            branch=release-promote--$TAG
            git push --force origin "HEAD:refs/heads/$branch"
            if [[ -n $(gh pr list --head "$branch" --base "$BRANCH" --state open --json number --jq '.[].number') ]]; then
              echo "::notice::the pull request from $branch is open already, now with this commit: merge it before the release pull request"
              exit 0
            fi
            gh pr create --base "$BRANCH" --head "$branch" --title "$title" --body "$TAG is published.
          This sets \`.release-please-manifest.json\` to ${TAG#v} and adds its entry to \`CHANGELOG.md\`, so the next release
          pull request proposes the next version's first release candidate. Merge it before the release pull request.
          (Opened by the Release workflow: $BRANCH took no direct push.)"
            echo "::notice::$BRANCH took no direct push: merge the pull request from $branch before the release pull request"
          fi
      # (the push above was made with GITHUB_TOKEN, which starts no workflow: the release pull request is made again here)
      - if: steps.record.outputs.pushed == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          target-branch: ${{ github.event.repository.default_branch }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
